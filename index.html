<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lego City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #eae4d6;
    --bg-soft: #f4efe4;
    --surface: #ffffff;
    --ink: #211d17;
    --ink-soft: #6b6255;
    --ink-faint: #9a9182;
    --line: #d8cfbd;

    --brick-red: #d5301e;
    --brick-red-dark: #a3220f;
    --brick-yellow: #f4b400;
    --brick-yellow-dark: #c98e00;
    --brick-blue: #0d63b3;
    --brick-blue-dark: #094b87;
    --brick-green: #16824c;
    --tan: #d3b781;
    --tan-dark: #a9885a;

    --carrot: #ee7a12;
    --carrot-dark: #c4620b;
    --carrot-leaf: #3f9142;

    --tier-s: #f2b705;
    --tier-a: #b48ce0;
    --tier-b: #5ca8f2;
    --tier-c: #52bf72;
    --tier-d: #a39a89;

    --shadow-color: 22deg 35% 12%;
    --radius: 22px;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #1c1912;
      --bg-soft: #24201870;
      --surface: #2a251c;
      --ink: #f2ece0;
      --ink-soft: #c2b8a5;
      --ink-faint: #8c8171;
      --line: #453d2f;

      --brick-red: #e8523c;
      --brick-red-dark: #b53522;
      --brick-yellow: #f7c53a;
      --brick-yellow-dark: #d69f10;
      --brick-blue: #4a94dd;
      --brick-blue-dark: #2c6cad;
      --brick-green: #35a26a;
      --tan: #c9a86e;
      --tan-dark: #8f7245;

      --carrot: #ff9438;
      --carrot-dark: #d97418;
      --carrot-leaf: #5cb85f;

      --tier-s: #f2c33d;
      --tier-a: #c7a8ec;
      --tier-b: #7cbcf5;
      --tier-c: #6fd08c;
      --tier-d: #b3a993;
    }
  }
  :root[data-theme="dark"]{
    --bg: #1c1912;
    --bg-soft: #24201870;
    --surface: #2a251c;
    --ink: #f2ece0;
    --ink-soft: #c2b8a5;
    --ink-faint: #8c8171;
    --line: #453d2f;

    --brick-red: #e8523c;
    --brick-red-dark: #b53522;
    --brick-yellow: #f7c53a;
    --brick-yellow-dark: #d69f10;
    --brick-blue: #4a94dd;
    --brick-blue-dark: #2c6cad;
    --brick-green: #35a26a;
    --tan: #c9a86e;
    --tan-dark: #8f7245;

    --carrot: #ff9438;
    --carrot-dark: #d97418;
    --carrot-leaf: #5cb85f;

    --tier-s: #f2c33d;
    --tier-a: #c7a8ec;
    --tier-b: #7cbcf5;
    --tier-c: #6fd08c;
    --tier-d: #b3a993;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
  }
  :root body{
    background-image:
      linear-gradient(180deg, rgba(10,8,5,.62) 0%, rgba(10,8,5,.5) 30%, rgba(10,8,5,.58) 60%, rgba(9,7,4,.9) 100%),
      url('city-hero.png');
    background-size: cover;
    background-position: center 30%;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  h1,h2,h3, .display{
    font-family: 'Baloo 2', 'Nunito', sans-serif;
    text-wrap: balance;
    margin: 0;
  }
  .mono{ font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

  button{ font-family: inherit; }
  a{ color: inherit; }

  #app{
    max-width: 720px;
    margin: 0 auto;
    padding: clamp(20px, 5vw, 48px) 18px 64px;
    min-height: 100vh;
    position: relative;
  }

  .view{ animation: rise .38s ease both; }
  @keyframes rise{ from{ opacity:0; transform: translateY(10px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){ .view{ animation:none; } }

  /* ---------- brick button ---------- */
  .brick{
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    border: none;
    border-radius: 16px;
    padding: 20px 24px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.28rem;
    color: #fff;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 10px 22px -10px hsl(var(--shadow-color) / 0.55);
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    margin-top: 14px;
  }
  .brick:hover{ filter: brightness(0.7); }
  .brick:active{ transform: translateY(2px); }
  .brick:focus-visible{ outline: 3px solid var(--ink); outline-offset: 3px; }
  .brick-red{ background: var(--brick-red); --brick-shade: var(--brick-red-dark); }
  .brick-blue{ background: var(--brick-blue); --brick-shade: var(--brick-blue-dark); }
  .brick-tan{ background: var(--tan); color:#3a2a00; --brick-shade: var(--tan-dark); }
  .brick-carrot{ background: var(--carrot); --brick-shade: var(--carrot-dark); }
  .brick-sub{ font-family:'Nunito',sans-serif; font-weight: 700; font-size: .78rem; opacity:.85; display:block; margin-top: 2px; letter-spacing:.02em; }

  /* ---------- home ---------- */
  .home-hero{ text-align: center; padding: 18px 0 8px; }
  .home-logo{
    width: 100%; max-width: 420px; height: auto; display: block; margin: 0 auto;
    filter: drop-shadow(0 10px 24px rgba(0,0,0,.6));
  }
  .home-tagline{
    color: #f3ecdc; font-weight: 700; margin-top: 14px; font-size: 1.02rem;
    text-shadow: 0 2px 10px rgba(0,0,0,.7), 0 1px 2px rgba(0,0,0,.8);
  }
  .home-actions{ margin-top: 20px; }

  .mini-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:12px; margin-top:14px; }
  .mini-tile{
    aspect-ratio: 1; border-radius: 14px; border:none; position:relative; overflow:hidden;
    background-size: cover; background-position: center; cursor:pointer; padding:0;
    box-shadow: 0 8px 18px -10px hsl(var(--shadow-color)/.55);
    transition: transform .12s ease, filter .12s ease;
  }
  .mini-tile:hover{ filter: brightness(0.7); }
  .mini-tile:active{ transform: translateY(2px); }
  .mini-tile-scrim{ position:absolute; inset:0; background: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(10,8,5,.82) 100%); }
  .mini-tile-label{
    position:absolute; bottom:7px; left:0; right:0; text-align:center;
    color:#fff; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:.88rem;
  }
  .mini-tile.locked{
    background: rgba(255,255,255,.07); display:flex; align-items:center; justify-content:center;
    cursor:default; box-shadow:none; border:1px dashed rgba(255,255,255,.3);
  }
  .mini-tile.locked:hover{ filter:none; }
  .mini-tile-banner{
    color:#f3ecdc; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:.68rem;
    text-transform:uppercase; letter-spacing:.05em; text-align:center; padding:0 6px; opacity:.85;
  }

  .map-page{
    position:relative; border-radius:26px; overflow:hidden;
    box-shadow: 0 24px 50px -22px hsl(var(--shadow-color)/.55); border:1px solid var(--line);
  }
  .map-image{ display:block; width:100%; height:auto; }
  .map-hotspot{
    position:absolute; width:28px; height:28px; margin:0; padding:0;
    transform:translate(-50%,-50%);
    border-radius:50%; border:2px solid #fff;
    background: var(--brick-red); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:.8rem;
    cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.55);
    transition: filter .12s ease, transform .12s ease;
  }
  .map-hotspot:hover{ filter:brightness(0.7); transform:translate(-50%,-50%) scale(1.15); }
  .map-hotspot:active{ transform:translate(-50%,-50%) scale(0.95); }

  /* ---------- people ---------- */
  .people-heading{
    text-align:center; font-size:1.5rem; color:#fbf6ea; margin-bottom:16px;
    text-shadow: 0 2px 8px rgba(0,0,0,.65), 0 1px 2px rgba(0,0,0,.8);
  }
  .people-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .people-box{
    aspect-ratio: 3/4; border-radius: 16px; overflow:hidden; position:relative;
    border: 1px solid var(--line); background: var(--surface);
    box-shadow: 0 10px 22px -12px hsl(var(--shadow-color)/.6);
  }
  .people-box img{ width:100%; height:100%; object-fit:cover; display:block; }
  @media (max-width: 420px){ .people-grid{ grid-template-columns: repeat(2, 1fr); } }

  /* ---------- street view (first-person) ---------- */
  .street-view{
    position:fixed; inset:0; z-index:200; background:#000;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .street-photo{
    width:100%; height:100%; object-fit:cover; display:block;
    animation: streetFade .35s ease;
  }
  @keyframes streetFade{ from{ opacity:0; transform:scale(1.02);} to{ opacity:1; transform:scale(1);} }
  .street-exit{
    position:absolute; top:18px; left:18px; z-index:2;
    display:flex; align-items:center; gap:6px; line-height:1;
    background: rgba(20,16,10,.6); backdrop-filter: blur(3px);
    color:#fff; border:1px solid rgba(255,255,255,.3);
    border-radius:999px; padding:10px 16px; cursor:pointer;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:.85rem;
    transition: background .12s ease;
  }
  .street-exit:hover{ background: rgba(20,16,10,.85); }
  .street-back{
    position:absolute; top:18px; right:18px; z-index:2;
    display:flex; align-items:center; gap:6px; line-height:1;
    background: rgba(20,16,10,.6); backdrop-filter: blur(3px);
    color:#fff; border:1px solid rgba(255,255,255,.3);
    border-radius:999px; padding:10px 16px; cursor:pointer;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:.85rem;
    transition: background .12s ease;
  }
  .street-back:hover{ background: rgba(20,16,10,.85); }
  .street-back svg{ transform: rotate(180deg); }
  .street-label{
    position:absolute; top:18px; left:50%; transform:translateX(-50%); z-index:2;
    display:flex; align-items:center; gap:6px; line-height:1;
    background: rgba(20,16,10,.6); backdrop-filter: blur(3px);
    color:#fff; border:1px solid rgba(255,255,255,.3);
    border-radius:999px; padding:10px 16px;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:.85rem;
  }
  .street-label svg{ display:block; flex-shrink:0; }
  .street-arrows{
    position:absolute; left:0; right:0; bottom:34px; z-index:2;
    display:flex; align-items:flex-end; justify-content:center; gap:34px;
    flex-wrap:wrap; padding:0 16px;
  }
  .street-arrow{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; cursor:pointer; padding:0;
    color:#fff; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:.72rem;
    text-transform:uppercase; letter-spacing:.04em;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,.6));
    transition: transform .12s ease;
  }
  .street-arrow:hover{ transform: translateY(-4px); }
  .street-arrow.dir-left:hover{ transform: translate(-3px,-4px); }
  .street-arrow.dir-right:hover{ transform: translate(3px,-4px); }
  .street-arrow:active{ transform: translateY(0) scale(.94); }
  .street-arrow svg{ width:46px; height:46px; transition: transform .12s ease; }
  .street-arrow.dir-left{ align-self:flex-end; }
  .street-arrow.dir-left svg{ transform: rotate(-32deg); }
  .street-arrow.dir-right{ align-self:flex-end; }
  .street-arrow.dir-right svg{ transform: rotate(32deg); }
  .street-arrow.dir-straight svg{ transform: rotate(0deg); }
  .street-arrow.dir-behind svg{ transform: rotate(180deg); }

  /* directional street-view transitions (forward/back zoom, left/right pan-rotate) */
  .street-photo.enter-forward{ animation: streetEnterForward .34s ease-out; }
  .street-photo.enter-backward{ animation: streetEnterBackward .34s ease-out; }
  .street-photo.enter-left{ animation: streetEnterLeft .34s ease-out; }
  .street-photo.enter-right{ animation: streetEnterRight .34s ease-out; }
  .street-photo.exit-forward{ animation: streetExitForward .26s ease-in forwards; }
  .street-photo.exit-backward{ animation: streetExitBackward .26s ease-in forwards; }
  .street-photo.exit-left{ animation: streetExitLeft .26s ease-in forwards; }
  .street-photo.exit-right{ animation: streetExitRight .26s ease-in forwards; }
  .street-transitioning .street-arrows,
  .street-transitioning .street-back,
  .street-transitioning .street-exit{ pointer-events:none; opacity:.35; transition: opacity .2s ease; }
  @keyframes streetEnterForward{ from{ opacity:0; transform:scale(.72); } to{ opacity:1; transform:scale(1); } }
  @keyframes streetEnterBackward{ from{ opacity:0; transform:scale(1.32); } to{ opacity:1; transform:scale(1); } }
  @keyframes streetEnterLeft{ from{ opacity:0; transform:scale(.92) rotate(9deg) translateX(9%); } to{ opacity:1; transform:scale(1) rotate(0) translateX(0); } }
  @keyframes streetEnterRight{ from{ opacity:0; transform:scale(.92) rotate(-9deg) translateX(-9%); } to{ opacity:1; transform:scale(1) rotate(0) translateX(0); } }
  @keyframes streetExitForward{ from{ opacity:1; transform:scale(1); } to{ opacity:0; transform:scale(1.4); } }
  @keyframes streetExitBackward{ from{ opacity:1; transform:scale(1); } to{ opacity:0; transform:scale(.68); } }
  @keyframes streetExitLeft{ from{ opacity:1; transform:scale(1) rotate(0) translateX(0); } to{ opacity:0; transform:scale(1.18) rotate(-11deg) translateX(-9%); } }
  @keyframes streetExitRight{ from{ opacity:1; transform:scale(1) rotate(0) translateX(0); } to{ opacity:0; transform:scale(1.18) rotate(11deg) translateX(9%); } }

  .street-placeholder{
    position:absolute; inset:0; z-index:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background: linear-gradient(160deg,#2b2418,#161310);
    color:#f3ecdc; text-align:center; padding:24px;
  }
  .street-placeholder .emoji{ font-size:3rem; }
  .street-placeholder h3{ font-family:'Baloo 2',sans-serif; font-size:1.3rem; margin:0; }
  .street-placeholder p{ font-family:'Nunito',sans-serif; color:#cfc3ab; max-width:340px; margin:0; }

  /* ---------- top bar ---------- */
  .topbar{ display:flex; align-items:center; gap:12px; margin-bottom: 22px; }
  .back-btn{
    display:flex; align-items:center; gap:6px; line-height:1;
    background: rgba(20,16,10,.55); backdrop-filter: blur(3px);
    color:#fff; border:1px solid rgba(255,255,255,.25);
    font-weight: 700; font-family:'Baloo 2',sans-serif; font-size: .88rem;
    padding: 9px 14px 9px 11px; border-radius: 999px; cursor:pointer;
    transition: filter .12s ease;
  }
  .back-btn:hover{ filter: brightness(0.7); }
  .back-btn:active{ transform: translateY(2px); }
  .back-btn svg, .post-back svg, .charity-back svg{ display:block; flex-shrink:0; }
  .topbar h2{
    font-size: 1.5rem; color:#fbf6ea;
    text-shadow: 0 2px 8px rgba(0,0,0,.65), 0 1px 2px rgba(0,0,0,.8);
  }

  /* ---------- actions grid ---------- */
  .grid{
    display:grid; grid-template-columns: repeat(2, 1fr); gap: 16px;
  }
  .tile{
    aspect-ratio: 1;
    border-radius: 18px;
    border: none;
    overflow: hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    cursor:pointer; position:relative;
    font-family:'Baloo 2',sans-serif; font-weight: 700; font-size: 1rem;
    color:#fff; background: var(--carrot);
    box-shadow: 0 10px 24px -12px hsl(var(--shadow-color)/.6);
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    padding: 14px;
    text-align:center;
  }
  .tile:hover{ filter: brightness(0.7); }
  .tile:active{ transform: translateY(2px); }
  .tile-icon-generic{ width: 40%; height:auto; opacity:.9; position:relative; z-index:1; }
  .tile-photo-bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .tile-scrim{ position:absolute; inset:0; background: linear-gradient(180deg, rgba(0,0,0,0) 42%, rgba(10,8,5,.85) 100%); }
  .tile-badge{
    position:absolute; top:9px; right:9px; z-index:2;
    width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: rgba(20,16,10,.5); backdrop-filter: blur(2px);
  }
  .tile-badge svg{ width:15px; height:15px; }
  .tile-dots{
    position:absolute; bottom:9px; left:9px; z-index:3;
    width:28px; height:28px; border-radius:50%; padding:0;
    display:flex; align-items:center; justify-content:center;
    background: rgba(20,16,10,.5); backdrop-filter: blur(2px);
    color:#fff; border:none; cursor:pointer; user-select:none;
    opacity:0; transition: opacity .15s ease;
  }
  .tile-dots svg{ width:16px; height:16px; }
  .tile:hover .tile-dots, .tile:focus-within .tile-dots{ opacity:1; }
  @media (hover:none){ .tile-dots{ opacity:.85; } }
  .tile-content{ position:relative; z-index:1; margin-top:auto; width:100%; }
  .tile-meta{ font-family:'Nunito',sans-serif; font-weight:700; font-size:.72rem; opacity:.85; text-transform:uppercase; letter-spacing:.04em; display:block; }
  .tile-title{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.2; }
  .tile.add-tile{
    background: rgba(12,10,7,.72); color: #f6f0e3;
    border: 2px dashed var(--tile-accent, rgba(255,255,255,.55));
    box-shadow: none;
  }
  .tile.add-tile:hover{ filter: none; background: rgba(12,10,7,.85); }
  .tile.add-tile:active{ transform:none; }
  .tile.add-tile svg{ width: 28%; color: var(--tile-accent, #f6f0e3); filter: drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
  .tile.add-tile span{ color: var(--tile-accent, #f6f0e3); font-weight:800; text-shadow: 0 1px 3px rgba(0,0,0,.6); }

  /* ---------- generic post page ---------- */
  .post{
    border-radius: 26px; overflow:hidden; position:relative;
    box-shadow: 0 24px 50px -22px hsl(var(--shadow-color)/.55);
    border: 1px solid var(--line); background: var(--surface);
  }
  .post-banner{
    height: 200px; position:relative; display:flex; align-items:flex-end;
    background-size: cover; background-position: center;
  }
  .post-banner.no-photo{ background: linear-gradient(160deg, var(--tile-accent, var(--carrot)), var(--bg)); }
  .post-banner.no-photo svg{ position:absolute; inset:0; margin:auto; width:72px; height:72px; color:rgba(255,255,255,.6); }
  .post-banner-scrim{ position:absolute; inset:0; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(15,12,8,.65) 100%); }
  .post-back{
    display:flex; align-items:center; gap:6px; line-height:1;
    position:absolute; top:16px; left:16px; z-index:2;
    background: rgba(20,16,10,.55); backdrop-filter: blur(3px);
    color:#fff; border:1px solid rgba(255,255,255,.25);
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:.85rem;
    padding: 8px 13px; border-radius:999px; cursor:pointer;
    transition: filter .12s ease;
  }
  .post-back:hover{ filter: brightness(0.7); }
  .post-body{ padding: 20px 22px 26px; }
  .post-meta{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .post-badge{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:.72rem; text-transform:uppercase; letter-spacing:.06em;
    padding: 4px 10px; border-radius:999px; background: var(--tile-accent, var(--carrot)); color:#fff;
  }
  .post-date{ color: var(--ink-faint); font-weight:700; font-size:.82rem; }
  .post-body h2{ font-size:1.5rem; margin-bottom:12px; }
  .post-body p{ line-height:1.6; color: var(--ink-soft); font-weight:500; margin:0 0 12px; }
  .post-eyebrow{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:.75rem;
    text-transform:uppercase; letter-spacing:.08em;
    padding: 5px 11px; border-radius:999px; color:#2b1300;
    margin-bottom:12px;
  }
  .color-swatches{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .color-swatch{
    width:32px; height:32px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0;
    transition: transform .12s ease, border-color .12s ease;
  }
  .color-swatch:hover{ transform: scale(1.1); }
  .color-swatch.selected{ border-color: var(--ink); }
  .color-swatch-custom{
    width:32px; height:32px; border-radius:50%; border:2px solid var(--line);
    padding:0; cursor:pointer; overflow:hidden;
  }
  .color-swatch-custom::-webkit-color-swatch-wrapper{ padding:0; }
  .color-swatch-custom::-webkit-color-swatch{ border:none; border-radius:50%; }

  /* ---------- carrot charity page ---------- */
  .charity{
    border-radius: 26px;
    overflow: hidden;
    position: relative;
    min-height: 560px;
    display:flex; flex-direction:column;
    box-shadow: 0 24px 50px -22px hsl(var(--shadow-color)/.55);
    border: 1px solid var(--line);
  }
  .charity-bg{ position:absolute; inset:0; }
  .charity-scrim{

  }
  .charity-meta{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .charity-eyebrow{
    display:inline-flex; align-items:center; gap:7px;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:.78rem;
    text-transform:uppercase; letter-spacing:.09em;
    background: rgba(238,122,18,.9); color:#2b1300;
    padding: 5px 11px; border-radius: 999px;
  }
  .charity-date{ color:#e9e0cf; font-weight:700; font-size:.82rem; }
  .charity h2{ font-size: 1.65rem; margin-bottom: 10px; color:#fff; }
  .charity p{ line-height: 1.55; color: #efe7d6; font-weight: 500; margin: 0 0 10px; }
  .charity-back{
    display:flex; align-items:center; gap:6px; line-height:1;
    position:absolute; top:16px; left:16px; z-index:2;
    background: rgba(20,16,10,.55); backdrop-filter: blur(3px);
    color:#fff; border:1px solid rgba(255,255,255,.25);
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:.85rem;
    padding: 8px 13px; border-radius:999px; cursor:pointer;
    transition: filter .12s ease;
  }
  .charity-back:hover{ filter: brightness(0.7); }
  .donate-cta{
    --glow-rgb: 244,180,0;
    margin-top: 16px; width:100%; border:none; border-radius: 999px;
    background: var(--brick-yellow); color:#3a2a00;
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.15rem;
    padding: 17px; cursor:pointer;
    box-shadow: 0 0 0 4px rgba(var(--glow-rgb),.22), 0 14px 26px -10px rgba(0,0,0,.6);
    animation: glow 2.6s ease-in-out infinite;
    transition: filter .12s ease;
  }
  .donate-cta:hover{ filter: brightness(0.7); }
  @keyframes glow{
    0%,100%{ box-shadow: 0 0 0 4px rgba(var(--glow-rgb),.22), 0 14px 26px -10px rgba(0,0,0,.6); }
    50%{ box-shadow: 0 0 0 9px rgba(var(--glow-rgb),.12), 0 14px 30px -8px rgba(0,0,0,.65); }
  }
  @media (prefers-reduced-motion: reduce){ .donate-cta{ animation:none; } }
  .donate-cta:active{ transform: translateY(3px); }

  /* ---------- modal ---------- */
  .modal-backdrop{
    position: fixed; inset:0; background: rgba(15,12,8,.6);
    display:flex; align-items:flex-end; justify-content:center; z-index: 50;
    padding: 0;
  }
  @media (min-width: 560px){ .modal-backdrop{ align-items:center; padding: 20px; } }
  .modal{
    background: var(--surface); width:100%; max-width: 460px;
    border-radius: 22px 22px 0 0; padding: 24px 22px 26px;
    box-shadow: 0 -10px 40px rgba(0,0,0,.3);
    max-height: 92vh; overflow-y:auto;
    animation: sheet .28s ease both;
  }
  @media (min-width: 560px){ .modal{ border-radius: 22px; } }
  @keyframes sheet{ from{ transform: translateY(24px); opacity:0;} to{ transform:none; opacity:1;} }
  @media (prefers-reduced-motion: reduce){ .modal{ animation:none; } }
  .modal h3{ font-size:1.35rem; margin-bottom: 4px; }
  .modal .modal-sub{ color: var(--ink-soft); font-weight:600; font-size:.9rem; margin-bottom:18px; }
  .field{ margin-bottom: 16px; }
  .field label{ display:block; font-weight:800; font-family:'Baloo 2',sans-serif; font-size:.92rem; margin-bottom:6px; }
  .field .hint{ font-size:.78rem; color: var(--ink-faint); font-weight:600; margin-top:5px; }
  .amount-row{ display:flex; align-items:stretch; border:2px solid var(--line); border-radius:14px; overflow:hidden; }
  .amount-row input{ flex:1; min-width:0; border:none; padding: 13px 12px; font-size:1.15rem; font-family:'JetBrains Mono',monospace; font-weight:700; background: var(--bg-soft); color: var(--ink); }
  .amount-row .suffix{ display:flex; align-items:center; padding: 0 14px; background: var(--carrot); color:#fff; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:.9rem; white-space:nowrap; }
  input[type="text"], input[type="number"], textarea{
    width:100%; border:2px solid var(--line); border-radius:14px; padding: 13px 14px;
    font-size:1rem; background: var(--bg-soft); color: var(--ink); font-family:'Nunito',sans-serif; font-weight:700;
  }
  textarea{ resize:vertical; min-height:90px; line-height:1.4; }
  input:focus-visible, textarea:focus-visible{ outline:3px solid var(--carrot); outline-offset:1px; }
  input::placeholder, textarea::placeholder{ color: var(--ink-faint); font-weight:600; }

  .photo-picker{ display:flex; align-items:center; gap:14px; }
  .photo-preview{
    width:58px; height:58px; border-radius:50%; object-fit:cover; flex-shrink:0;
    border: 2px solid var(--line); background: var(--bg-soft);
  }
  .photo-btn{
    border:2px dashed var(--line); background:transparent; color: var(--ink-soft);
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:.88rem;
    padding: 11px 14px; border-radius: 14px; cursor:pointer; flex:1;
    transition: filter .12s ease, background .12s ease;
  }
  .photo-btn:hover{ background: var(--bg-soft); filter: brightness(0.7); }
  .modal-actions{ display:flex; gap:10px; margin-top: 4px; }
  .btn-ghost{
    flex: 1; background:transparent; border:2px solid var(--line); color: var(--ink-soft);
    font-family:'Baloo 2',sans-serif; font-weight:700; padding: 13px; border-radius: 14px; cursor:pointer;
    transition: filter .12s ease, background .12s ease;
  }
  .btn-ghost:hover{ background: var(--bg-soft); filter: brightness(0.7); }
  .btn-submit{
    flex: 1.4; background: var(--brick-green); color:#fff; border:none;
    font-family:'Baloo 2',sans-serif; font-weight:800; padding: 13px; border-radius: 14px; cursor:pointer;
    transition: filter .12s ease;
  }
  .btn-submit:hover:not(:disabled){ filter: brightness(0.7); }
  .btn-submit:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-submit.danger{ background: var(--brick-red); }
  .error-msg{ color: var(--brick-red); font-weight:700; font-size:.85rem; margin-top:10px; min-height: 1.1em; }

  /* ---------- menu sheet ---------- */
  .menu-sheet{ display:flex; flex-direction:column; gap:8px; }
  .menu-item{
    width:100%; text-align:left; padding:14px 16px; border-radius:12px; border:none;
    background: var(--bg-soft); color: var(--ink);
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1rem; cursor:pointer;
    transition: filter .12s ease;
  }
  .menu-item:hover{ filter: brightness(0.7); }
  .menu-item.danger{ color:#fff; background: var(--brick-red); }
  .menu-item.cancel{ background:transparent; color: var(--ink-soft); text-align:center; }

  /* ---------- kind selector (project creation) ---------- */
  .kind-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap:8px; }
  .kind-option{
    display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    border:2px solid var(--line); border-radius:12px; padding:10px 12px; cursor:pointer;
    background: var(--bg-soft); text-align:left;
  }
  .kind-option b{ font-family:'Baloo 2',sans-serif; font-size:.92rem; color: var(--ink); }
  .kind-option span{ font-size:.75rem; color: var(--ink-faint); font-weight:600; }
  .kind-option.selected{ border-color: var(--carrot); background: rgba(238,122,18,.1); }
  .poll-option-row{ display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .poll-option-row input{ flex:1; }
  .poll-option-remove{
    flex-shrink:0; width:34px; height:34px; border-radius:10px; border:2px solid var(--line);
    background:transparent; color: var(--ink-faint); cursor:pointer; font-size:1.1rem; line-height:1;
  }
  .add-option-btn{
    width:100%; border:2px dashed var(--line); background:transparent; color: var(--ink-soft);
    font-family:'Baloo 2',sans-serif; font-weight:700; padding:10px; border-radius:12px; cursor:pointer; margin-top:2px;

  /* ---------- poll & petition ---------- */
  .poll-list{ display:flex; flex-direction:column; gap:10px; margin:16px 0; }
  .poll-row{
    position:relative; border:2px solid var(--line); border-radius:12px; overflow:hidden;
    background: var(--bg-soft); cursor:pointer; padding:12px 14px;
    transition: filter .12s ease;
  }
  .poll-row:hover{ filter: brightness(0.7); }
  .poll-fill{
    position:absolute; inset:0; width:0; background: rgba(238,122,18,.22);
    transition: width .4s ease;
  }
  .poll-row-content{ position:relative; z-index:1; display:flex; justify-content:space-between; gap:10px; font-weight:700; color: var(--ink); }
  .poll-meta{ text-align:center; color: var(--ink-faint); font-weight:700; font-size:.82rem; margin-top:4px; }
  .sign-cta{
    margin-top:10px; width:100%; border:none; border-radius:999px;
    background: var(--brick-green); color:#fff;
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.05rem; padding:14px; cursor:pointer;
    transition: filter .12s ease;
  }
  .sign-cta:hover{ filter: brightness(0.7); }
  .petition-box{ text-align:center; margin:16px 0; }
  .petition-count{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:2rem; color: var(--ink); }
  .petition-count-label{ color: var(--ink-faint); font-weight:700; font-size:.85rem; text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; }
  .signer-list{ margin-top:16px; display:flex; flex-direction:column; gap:8px; }
  .signer-card{
    display:flex; align-items:center; gap:10px;
    background: var(--bg-soft); border:1px solid var(--line); border-radius:12px; padding:8px 12px;
  }
  .signer-sig{ height:30px; width:76px; object-fit:contain; background:#fff; border-radius:6px; border:1px solid var(--line); flex-shrink:0; }
  .signer-name{ font-weight:700; font-size:.9rem; color: var(--ink); }
  .sig-pad{ width:100%; height:140px; border:2px solid var(--line); border-radius:14px; background:#fff; touch-action:none; cursor:crosshair; display:block; }

  /* ---------- comments ---------- */
  .comment-cta{
    margin-top:16px; width:100%; border:2px solid var(--line); background:transparent; color: var(--ink);
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1rem; padding:13px; border-radius:14px; cursor:pointer;
    transition: filter .12s ease, background .12s ease;
  }
  .comment-cta:hover{ background: var(--bg-soft); }
  .comments-list{ margin-top:18px; display:flex; flex-direction:column; gap:10px; }
  .comment-item{
    position:relative; background: var(--bg-soft); border:1px solid var(--line); border-radius:14px;
    padding:12px 34px 12px 12px; display:flex; gap:10px;
  }
  .comment-avatar{
    width:34px; height:34px; border-radius:50%; object-fit:cover; flex-shrink:0;
    border:2px solid var(--line); background: var(--bg-soft);
  }
  .comment-body{ flex:1; min-width:0; }
  .comment-name{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:.9rem; color: var(--ink); }
  .comment-date{ color: var(--ink-faint); font-weight:600; font-size:.72rem; margin-left:6px; }
  .comment-text{ color: var(--ink-soft); font-weight:500; font-size:.92rem; margin-top:4px; line-height:1.45; }
  .comment-dots{

    background:transparent; color: var(--ink-faint); opacity:0; transition: opacity .15s ease;
  }
  .comment-dots svg{ width:15px; height:15px; }
  .comment-item:hover .comment-dots, .comment-item:focus-within .comment-dots{ opacity:1; }
  @media (hover:none){ .comment-dots{ opacity:.7; } }
  .comments-empty{ color: var(--ink-faint); font-weight:600; font-size:.88rem; margin-top:14px; text-align:center; }

  /* ---------- leaderboard ---------- */
  .lb-head{ text-align:center; margin-bottom: 8px; }
  .lb-head .kicker{
    font-family:'Baloo 2',sans-serif; font-weight:700; color: var(--carrot); text-transform:uppercase; font-size:.8rem; letter-spacing:.1em;
    text-shadow: 0 1px 4px rgba(0,0,0,.7);
  }
  .lb-head h2{
    font-size: 1.9rem; margin-top:4px; color:#fbf6ea;
    text-shadow: 0 2px 8px rgba(0,0,0,.65), 0 1px 2px rgba(0,0,0,.8);
  }
  .lb-empty{ text-align:center; padding: 50px 20px; color: #e9e0cf; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .lb-empty svg{ width:64px; margin-bottom:14px; opacity:.8; }

  .tier-group{ margin-top: 22px; }
  .tier-label{
    display:flex; align-items:center; gap:10px; margin-bottom:10px;
  }
  .tier-chip{
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:.85rem; color:#241a00;
    width: 34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  }
  .tier-name{
    font-family:'Baloo 2',sans-serif; font-weight:700; color:#f3ecdc; font-size:.95rem;
    text-shadow: 0 1px 4px rgba(0,0,0,.6);
  }
  .tier-line{ flex:1; height:2px; background: rgba(255,255,255,.28); }

  .row{
    display:flex; align-items:center; gap:12px;
    background: var(--surface); border:1px solid var(--line); border-radius:16px;
    padding: 10px 14px; margin-bottom:9px;
  }
  .row.fresh{ animation: pop .5s ease; }
  @keyframes pop{ 0%{ box-shadow: 0 0 0 0 rgba(238,122,18,.55);} 100%{ box-shadow: 0 0 0 12px rgba(238,122,18,0);} }
  @media (prefers-reduced-motion: reduce){ .row.fresh{ animation:none; } }
  .rank{ width: 26px; text-align:center; font-family:'Baloo 2',sans-serif; font-weight:800; color: var(--ink-faint); font-size: 1rem; flex-shrink:0; }
  .rank.top1{ color: var(--tier-s); font-size:1.3rem; }
  .rank.top2{ color: var(--ink-soft); }
  .rank.top3{ color: var(--carrot-dark); }
  .avatar{ width:42px; height:42px; border-radius:50%; object-fit:cover; border:2px solid var(--line); flex-shrink:0; background: var(--bg-soft); }
  .row-name{ flex:1; min-width:0; }
  .row-name .n{ font-weight:800; font-family:'Baloo 2',sans-serif; font-size:1rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row-amount{ text-align:right; flex-shrink:0; }
  .row-amount .a{ font-weight:700; font-size:1.02rem; color: var(--brick-green); }
  .row-amount .a .unit{ font-size:.72em; color: var(--ink-faint); font-family:'Nunito',sans-serif; font-weight:800; margin-left:2px; }

  .lb-actions{ display:flex; gap:10px; margin-top: 26px; }
  .lb-actions .brick{ margin-top:0; }

  /* ---------- blocktube ---------- */
  .blocktube-toolbar{
    display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap;
  }
  .blocktube-toolbar .sort-select{
    flex:1; min-width:150px; border:2px solid var(--line); border-radius:12px;
    padding:9px 12px; background: var(--bg-soft); color: var(--ink);
    font-family:'Nunito',sans-serif; font-weight:700; font-size:.88rem; cursor:pointer;
  }
  .blocktube-create{
    display:flex; align-items:center; gap:6px; line-height:1; white-space:nowrap;

  .video-grid{ display:flex; flex-direction:column; gap:14px; }
  .video-tile{
    display:flex; gap:12px; text-align:left; border:none; cursor:pointer; padding:0; position:relative;
    background: var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden;
    transition: filter .12s ease;
  }
  .video-tile:hover{ filter: brightness(0.85); }
  .video-tile-dots{
    position:absolute; top:8px; right:8px; z-index:3;
    width:28px; height:28px; border-radius:50%; padding:0;
    display:flex; align-items:center; justify-content:center;

  .video-tile-dots svg{ width:15px; height:15px; }
  .video-tile:hover .video-tile-dots, .video-tile:focus-within .video-tile-dots{ opacity:1; }

  .video-thumb{
    position:relative; flex-shrink:0; width:130px; aspect-ratio:16/10; background: var(--bg-soft);
    background-size:cover; background-position:center;
  }
  .video-thumb .badge-play{

    color:#fff; opacity:.9; filter: drop-shadow(0 2px 6px rgba(0,0,0,.6));

  .video-thumb .badge-play svg{ width:30px; height:30px; }
  .video-tile-body{ flex:1; min-width:0; padding:10px 14px 10px 0; display:flex; flex-direction:column; justify-content:center; gap:3px; }
  .video-tile-title{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:.98rem; color: var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .video-tile-creator{ color: var(--ink-soft); font-weight:700; font-size:.8rem; }
  .video-tile-stats{ display:flex; gap:10px; color: var(--ink-faint); font-weight:700; font-size:.76rem; margin-top:2px; }
  .video-tile-stats span{ display:inline-flex; align-items:center; gap:4px; }
  .video-tile-stats svg{ width:13px; height:13px; }
  .blocktube-empty{ text-align:center; padding: 50px 20px; color: #e9e0cf; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .blocktube-empty svg{ width:64px; margin-bottom:14px; opacity:.8; }

  .video-page{
    border-radius: 26px; overflow:hidden; position:relative;
    box-shadow: 0 24px 50px -22px hsl(var(--shadow-color)/.55);
    border: 1px solid var(--line); background: var(--surface);
  }
  .video-stage{ position:relative; width:100%; aspect-ratio:16/9; background:#000; }
  .video-stage video{ width:100%; height:100%; display:block; }
  .video-stage .video-cover{
    position:absolute; inset:0; background-size:cover; background-position:center;
  }
  .video-gate{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    background: linear-gradient(180deg, rgba(10,8,5,.55) 0%, rgba(10,8,5,.85) 100%);
    color:#fff; text-align:center; padding:20px;
  }
  .video-gate svg{ width:38px; height:38px; opacity:.85; }
  .video-gate p{ font-family:'Nunito',sans-serif; font-weight:600; color:#e9e0cf; margin:0 0 6px; max-width:320px; }
  .video-gate-btn{
    border:none; border-radius:999px; background: var(--brick-red); color:#fff;
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:.95rem;
    padding: 12px 22px; cursor:pointer; transition: filter .12s ease;
  }
  .video-gate-btn:hover{ filter: brightness(0.8); }
  .video-body{ padding: 20px 22px 26px; }
  .video-title{ font-size:1.35rem; margin-bottom:8px; }
  .video-creator-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .video-creator-avatar{ width:36px; height:36px; border-radius:50%; object-fit:cover; border:2px solid var(--line); background: var(--bg-soft); }
  .video-creator-name{ font-weight:800; font-family:'Baloo 2',sans-serif; font-size:.92rem; color: var(--ink); }
  .video-date{ color: var(--ink-faint); font-weight:700; font-size:.82rem; }
  .video-dots{
    position:absolute; top:16px; right:16px; z-index:2;
    width:34px; height:34px; border-radius:50%; padding:0;
    display:flex; align-items:center; justify-content:center;
    background: rgba(20,16,10,.55); backdrop-filter: blur(3px);
    color:#fff; border:none; cursor:pointer;
  }
  .video-dots svg{ width:16px; height:16px; }
  .video-stats-row{ display:flex; align-items:center; gap:16px; margin-bottom:14px; color: var(--ink-faint); font-weight:700; font-size:.85rem; }
  .video-stats-row span{ display:inline-flex; align-items:center; gap:5px; }
  .video-stats-row svg{ width:16px; height:16px; }
  .like-btn{
    display:inline-flex; align-items:center; gap:6px; border:2px solid var(--line); background:transparent;
    color: var(--ink); font-family:'Baloo 2',sans-serif; font-weight:800; font-size:.9rem;

  .like-btn.liked{ border-color: var(--brick-red); color: var(--brick-red); }
  .like-btn svg{ width:17px; height:17px; }
  .video-desc{ line-height:1.6; color: var(--ink-soft); font-weight:500; margin: 4px 0 12px; }

  .toast{
    position: fixed; left:50%; bottom: 26px; transform: translateX(-50%) translateY(0);
    background: var(--ink); color: var(--bg); font-family:'Baloo 2',sans-serif; font-weight:700; font-size:.9rem;
    padding: 12px 18px; border-radius: 999px; z-index: 80; box-shadow: 0 10px 26px rgba(0,0,0,.3);
    animation: toast-in .25s ease, toast-out .3s ease 2.2s forwards;

  function toSnake(s){ return s.replace(/[A-Z]/g, function(m){ return "_" + m.toLowerCase(); }); }
  function toCamel(s){ return s.replace(/_([a-z0-9])/g, function(_,c){ return c.toUpperCase(); }); }
  function rowToCamel(row){
    const out = {};
    Object.keys(row).forEach(function(k){ out[k === "id" ? "id" : toCamel(k)] = row[k]; });
    return out;
  }
  function entryToSnake(entry){
    const out = {};
    Object.keys(entry).forEach(function(k){ out[toSnake(k)] = entry[k]; });
    return out;
  }

  /* ================= data store (Supabase table, with local fallback) ================= */
  function createCollectionStore(collectionName, orderField, orderDir){
    const table = toSnake(collectionName);
    const orderCol = toSnake(orderField);
    let usingDb = false;
    let local = [];
    let lastDbList = [];
    let hasEmittedDb = false;
    const listeners = [];
    const LOCAL_KEY = "legoCity_" + collectionName + "_v1";

    function loadLocal(){
      try{ local = JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); }
      catch(e){ local = []; }
    }
    function saveLocal(){
      try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(local)); }catch(e){}
    }
    function sortLocal(list){
      return list.slice().sort(function(a,b){
        const av = a[orderField] || 0, bv = b[orderField] || 0;
        if (av < bv) return orderDir === "desc" ? 1 : -1;
        if (av > bv) return orderDir === "desc" ? -1 : 1;
        return 0;
      });
    }
    function emit(list){
      lastDbList = list;
      hasEmittedDb = true;
      listeners.forEach(function(fn){ fn(list); });
    }
    function emitLocal(){ emit(sortLocal(local)); }

    async function fetchAll(){
      const { data, error } = await supa
        .from(table)
        .select("*")
        .order(orderCol, { ascending: orderDir !== "desc" })
        .limit(300);
      if (error){ console.error("lego city db error (" + collectionName + ")", error); return; }
      emit(data.map(rowToCamel));
    }

    async function init(){
      loadLocal();
      emitLocal();
      if (supa){
        usingDb = true;
        try{
          await fetchAll();
          supa
            .channel(table + "-changes")
            .on("postgres_changes", { event: "*", schema: "public", table: table }, fetchAll)
            .subscribe();
        }catch(e){ console.error(e); }
      }
    }

    function subscribe(fn){
      listeners.push(fn);
      if (!usingDb) fn(sortLocal(local));
      else if (hasEmittedDb) fn(lastDbList);
      return function(){
        const i = listeners.indexOf(fn);
        if (i>-1) listeners.splice(i,1);
      };
    }

    async function add(entry){
      if (usingDb){
        const { data, error } = await supa.from(table).insert(entryToSnake(entry)).select().single();
        if (error) throw error;
        return data.id;
      } else {
        const id = "local-" + Date.now() + "-" + Math.random().toString(36).slice(2);
        local.push(Object.assign({ id: id }, entry));
        saveLocal();
        emitLocal();
        return id;
      }
    }

    async function update(id, patch){
      if (usingDb){
        const { error } = await supa.from(table).update(entryToSnake(patch)).eq("id", id);
        if (error) throw error;
      } else {
        const item = local.find(function(x){ return x.id === id; });
        if (item) Object.assign(item, patch);
        saveLocal();
        emitLocal();
      }
    }

    async function remove(id){
      if (usingDb){
        const { error } = await supa.from(table).delete().eq("id", id);
        if (error) throw error;
      } else {
        local = local.filter(function(x){ return x.id !== id; });
        saveLocal();
        emitLocal();
      }
    }

    return { init: init, subscribe: subscribe, add: add, update: update, remove: remove };
  }

        const path = Date.now() + "-" + Math.random().toString(36).slice(2) + "-" + (file.name || "video.mp4").replace(/[^a-zA-Z0-9_.-]/g, "_");
        const { error } = await supa.storage.from("videos").upload(path, file, { contentType: file.type || "video/mp4" });
        if (error) throw error;
        const { data } = supa.storage.from("videos").getPublicUrl(path);
        return { id: path, url: data.publicUrl };
      }
      const id = "local-" + Date.now() + "-" + Math.random().toString(36).slice(2);
      const url = URL.createObjectURL(file);
      localBlobs[id] = url;
      return { id: id, url: url };
    }
    return { init: init, upload: upload };
  })();

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function hexToRgb(hex){
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || "");
    if (!m) return "244,180,0";
    return parseInt(m[1],16) + "," + parseInt(m[2],16) + "," + parseInt(m[3],16);
  }
  function textColorFor(hex){
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || "");
    if (!m) return "#2b1300";
    const r = parseInt(m[1], 16), g = parseInt(m[2], 16), b = parseInt(m[3], 16);
    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luminance > 0.6 ? "#2b1300" : "#ffffff";
  }

  // Fixed visual direction (left/straight/right) for each neighbour at the
  // two 3-way junctions. Each neighbour always slants the same way no matter
  // which spot you arrived from — going Back and then forward again (or
  // approaching from any other direction) never re-labels these arrows.
  // Degree-1/2 spots aren't listed: with only one way forward it's always
  // rendered "straight".
  const NODE_TURNS = {
    13: { 7: "right", 12: "left" },
    6: { 4: "left", 8: "right", 3: "behind" },
    3: { 2: "behind" },
    18: { 16: "right" }
  };

  function StreetView(spotId, cameFrom, enterAnim){
    const photo = SPOT_PHOTOS[spotId];
    const neighbours = STREET_GRAPH[spotId] || [];

    const forwardIds = neighbours.filter(function(n){ return n !== cameFrom; });
    const fixedTurns = NODE_TURNS[spotId];

    function animFor(dir){
      if (dir === "left") return "left";
      if (dir === "right") return "right";
      if (dir === "behind") return "backward";
      return "forward";
    }

    const arrowsHtml = forwardIds.map(function(n){
      const dir = fixedTurns ? (fixedTurns[n] || "straight") : "straight";
      return '<button type="button" class="street-arrow dir-' + dir + '" data-to="' + n + '" data-anim="' + animFor(dir) + '">' +
        ICONS.chevron + '<span>Spot ' + n + "</span>" +
      "</button>";
    }).join("");

    const enterClass = enterAnim ? (" enter-" + enterAnim) : "";

    const wrap = el(
      '<div class="street-view">' +
        '<button class="street-exit" id="streetExit">' + ICONS.back + " Exit to map</button>" +
        (cameFrom != null ? '<button class="street-back" id="streetBack">' + ICONS.back + " Back</button>" : "") +
        '<span class="street-label">' + ICONS.pin + " Spot " + spotId + "</span>" +
        '<img class="street-photo' + enterClass + '" src="' + photo + '" alt="Street view of spot ' + spotId + '" />' +
        '<div class="street-arrows">' + arrowsHtml + "</div>" +
      "</div>"
    );

    function goTo(nextId, nextFrom, exitAnim){
      const img = wrap.querySelector(".street-photo");
      wrap.classList.add("street-transitioning");
      img.classList.add("exit-" + exitAnim);
      setTimeout(function(){
        render("spot", { id: nextId, from: nextFrom, anim: exitAnim });
      }, 260);
    }

    wrap.querySelector("#streetExit").addEventListener("click", function(){ render("map"); });
    const backBtn = wrap.querySelector("#streetBack");
    if (backBtn) backBtn.addEventListener("click", function(){ goTo(cameFrom, spotId, "backward"); });
    wrap.querySelectorAll(".street-arrow").forEach(function(btn){
      btn.addEventListener("click", function(){
        const to = Number(btn.dataset.to);
        goTo(to, spotId, btn.dataset.anim || "forward");
      });
    });

    streetKeyHandler = function(e){
      if (e.key === "Escape") render("map");
    };
    document.addEventListener("keydown", streetKeyHandler);

    return wrap;
  }

  function fmtCount(n){
    n = Number(n) || 0;
    if (n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/,"") + "M";
    if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,"") + "k";
    return String(n);
  }

  function croppedPhotoPicker(fileInput, previewImg, size, onDone){
    fileInput.addEventListener("change", function(e){
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const img = new Image();
      const reader = new FileReader();
      reader.onload = function(ev){
        img.onload = function(){
          const canvas = document.createElement("canvas");
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext("2d");
          const side = Math.min(img.width, img.height);
          const sx = (img.width - side) / 2, sy = (img.height - side) / 2;
          ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.75);
          previewImg.src = dataUrl;
          onDone(dataUrl);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function openSignModal(post){
    const backdrop = el(
      '<div class="modal-backdrop">' +
        '<div class="modal">' +
          "<h3>Sign this petition</h3>" +
          '<div class="field"><label for="sgName">Your name</label><input id="sgName" type="text" maxlength="40" placeholder="How should we list you?" /></div>' +
          '<div class="field">' +
            "<label>Your signature</label>" +
            '<canvas id="sigPad" class="sig-pad" width="440" height="140"></canvas>' +
            '<button type="button" class="photo-btn" id="sigClear" style="margin-top:8px;">Clear signature</button>' +
          "</div>" +
          '<div class="error-msg" id="sgError"></div>' +
          '<div class="modal-actions"><button class="btn-ghost" id="sgCancel">Not now</button><button class="btn-submit" id="sgSubmit">Sign</button></div>' +
        "</div>" +
      "</div>"
    );
    document.body.appendChild(backdrop);

    const canvas = backdrop.querySelector("#sigPad");
    const ctx = canvas.getContext("2d");
    ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1a1a1a";
    let drawing = false, hasDrawn = false;
    function pointFromEvent(e){
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
      return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
    }
    canvas.addEventListener("pointerdown", function(e){
      drawing = true; hasDrawn = true;
      const p = pointFromEvent(e);
      ctx.beginPath(); ctx.moveTo(p.x, p.y);
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener("pointermove", function(e){
      if (!drawing) return;
      const p = pointFromEvent(e);
      ctx.lineTo(p.x, p.y); ctx.stroke();
    });
    canvas.addEventListener("pointerup", function(){ drawing = false; });
    canvas.addEventListener("pointerleave", function(){ drawing = false; });
    backdrop.querySelector("#sigClear").addEventListener("click", function(){
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hasDrawn = false;
    });

    function close(){ backdrop.remove(); }
    backdrop.addEventListener("click", function(e){ if (e.target === backdrop) close(); });
    backdrop.querySelector("#sgCancel").addEventListener("click", close);
    backdrop.querySelector("#sgSubmit").addEventListener("click", async function(){
      const name = backdrop.querySelector("#sgName").value.trim();
      const errorEl = backdrop.querySelector("#sgError");
      if (!name){ errorEl.textContent = "Tell us who’s signing."; return; }
      if (!hasDrawn){ errorEl.textContent = "Draw your signature above."; return; }
      errorEl.textContent = "";
      const btn = backdrop.querySelector("#sgSubmit");
      btn.disabled = true; btn.textContent = "Signing…";
      try{
        const signatureDataUrl = canvas.toDataURL("image/png");
        await SignaturesStore.add({ postId: post.id, name: name.slice(0,40), signature: signatureDataUrl, createdAt: new Date().toISOString() });
        close();
      }catch(err){
        console.error(err);
        errorEl.textContent = "That didn’t go through — try again.";
        btn.disabled = false; btn.textContent = "Sign";
      }
    });
  }

  function CarrotView(){

      '<div class="view">' +
        '<div class="charity">' +
          '<button class="charity-back" id="toActions">' + ICONS.back + " Projects</button>" +
          '<div class="charity-bg" style="background-image:url(\'toy-shelf.jpeg\'); background-size:cover; background-position:38% 30%;"></div>' +
          '<div class="charity-scrim"></div>' +
          '<div class="charity-content">' +
            '<div class="charity-meta">' +
              '<span class="charity-eyebrow">' + ICONS.carrotMini.replace('viewBox', 'width="16" height="16" style="vertical-align:-3px" viewBox') + " Wiping Greediness</span>" +
              '<span class="charity-date">' + fmtDate(CARROT_FOUNDED) + "</span>" +
            "</div>" +
            "<h2>Carrot’s Charity</h2>" +
            "<p>In the shops, Booster girl’s shop has shelf after shelf of shine — gold plates, priceless cups, more shiny bricks than one shop could ever need. Carrot thinks that’s a little much while half of Lego City is short on money and needs help.</p>" +
            "<p>So Carrot’s calling it: every last stud, cup, and trinket off those shelves gets counted up and turned into a donation for citizens who need it most. Chip in a few million dollars and your name goes up on the wall of honour as well as contributing to a better place.</p>" +
            '<button class="donate-cta" id="openDonate">Donate</button>' +
          "</div>" +
        "</div>" +
        '<div style="text-align:center;margin-top:16px;">' +
          '<button class="back-btn" id="toLeaderboard" style="margin:0 auto;">See the leaderboard →</button>' +
        "</div>" +
      "</div>"
    );
    const carrotCtx = { projectId: "carrot", title: "Carrot’s Charity", kicker: "Wiping Greediness", back: { view: "carrot" } };
    wrap.querySelector("#toActions").addEventListener("click", function(){ render("projects"); });
    wrap.querySelector("#toLeaderboard").addEventListener("click", function(){ render("leaderboard", carrotCtx); });
    wrap.querySelector("#openDonate").addEventListener("click", function(){ openDonateModal(carrotCtx); });
    return wrap;
  }

  function openDonateModal(ctx){
    let photoDataUrl = null;
    const backdrop = el(
      '<div class="modal-backdrop">' +
        '<div class="modal">' +
          "<h3>Chip in for " + escapeHtml(ctx.title) + "</h3>" +
          '<p class="modal-sub">Every donation lands straight on the leaderboard.</p>' +
          '<div class="field">' +
            '<label for="dAmount">Donation amount</label>' +
            '<div class="amount-row">' +
              '<input id="dAmount" type="number" min="0.1" step="0.1" inputmode="decimal" placeholder="e.g. 42" />' +
              '<span class="suffix">million dollars</span>' +
            "</div>" +
          "</div>" +
          '<div class="field">' +
            '<label for="dName">Your name</label>' +
            '<input id="dName" type="text" maxlength="40" placeholder="How should we credit you?" />' +
          "</div>" +
          '<div class="field">' +
            '<label>Photo <span style="font-weight:600;color:var(--ink-faint);text-transform:none;">(optional, recommended)</span></label>' +
            '<div class="photo-picker">' +
              '<img class="photo-preview" id="photoPreview" src="' + ICONS.carrotAvatar + '" alt="" />' +
              '<button type="button" class="photo-btn" id="pickPhoto">' + "Choose photo</button>" +
              '<input type="file" accept="image/*" id="photoInput" class="visually-hidden" />' +
            "</div>" +
          "</div>" +
          '<div class="error-msg" id="dError"></div>' +
          '<div class="modal-actions">' +
            '<button class="btn-ghost" id="dCancel">Not now</button>' +
            '<button class="btn-submit" id="dSubmit">Send it in</button>' +
          "</div>" +
        "</div>" +
      "</div>"
    );
    document.body.appendChild(backdrop);

    function close(){ backdrop.remove(); }
    backdrop.addEventListener("click", function(e){ if (e.target === backdrop) close(); });
    backdrop.querySelector("#dCancel").addEventListener("click", close);

    backdrop.querySelector("#pickPhoto").addEventListener("click", function(){
      backdrop.querySelector("#photoInput").click();
    });
    backdrop.querySelector("#photoInput").addEventListener("change", function(e){
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const img = new Image();
      const reader = new FileReader();
      reader.onload = function(ev){
        img.onload = function(){
          const size = 140;
          const canvas = document.createElement("canvas");
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext("2d");
          const side = Math.min(img.width, img.height);
          const sx = (img.width - side)/2, sy = (img.height - side)/2;
          ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
          photoDataUrl = canvas.toDataURL("image/jpeg", 0.72);
          backdrop.querySelector("#photoPreview").src = photoDataUrl;
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    backdrop.querySelector("#dSubmit").addEventListener("click", async function(){
      const amountVal = parseFloat(backdrop.querySelector("#dAmount").value);
      const nameVal = backdrop.querySelector("#dName").value.trim();
      const errorEl = backdrop.querySelector("#dError");
      if (!nameVal){ errorEl.textContent = "Tell us who’s donating."; return; }
      if (!amountVal || amountVal <= 0){ errorEl.textContent = "Enter how many million dollars you’re giving."; return; }
      errorEl.textContent = "";
      const btn = backdrop.querySelector("#dSubmit");
      btn.disabled = true; btn.textContent = "Sending…";
      try{
        lastAddedId = await DonationsStore.add({
          projectId: ctx.projectId,
          name: nameVal.slice(0,40),
          amount: Math.round(amountVal*100)/100,
          photo: photoDataUrl,
          createdAt: new Date().toISOString()
        });
        close();
        render("leaderboard", ctx);
      }catch(err){
        console.error(err);
        errorEl.textContent = "That didn’t go through — give it another try.";
        btn.disabled = false; btn.textContent = "Send it in";
      }
    });
  }

  function LeaderboardView(ctx){
    const wrap = el(
      '<div class="view">' +
        '<div class="topbar">' +
          '<button class="back-btn" id="toBackTarget">' + ICONS.back + " Back</button>" +
          "<h2>Leaderboard</h2>" +
        "</div>" +
        '<div class="lb-head">' +
          '<div class="kicker">' + escapeHtml(ctx.kicker || ctx.title) + "</div>" +
          "<h2>Wall of Honour</h2>" +
        "</div>" +
        '<div id="lbBody"></div>' +
        '<div class="lb-actions">' +
          '<button class="brick brick-carrot" id="lbDonate">Donate more</button>' +
        "</div>" +
      "</div>"
    );
    wrap.querySelector("#toBackTarget").addEventListener("click", function(){ render(ctx.back.view, ctx.back.arg); });
    wrap.querySelector("#lbDonate").addEventListener("click", function(){
      render(ctx.back.view, ctx.back.arg);
      setTimeout(function(){ openDonateModal(ctx); }, 20);
    });

    if (unsubscribeLb) unsubscribeLb();
    unsubscribeLb = DonationsStore.subscribe(function(allDonations){
      const donations = allDonations.filter(function(d){
        return d.projectId === ctx.projectId || (ctx.projectId === "carrot" && !d.projectId);
      });
      const body = wrap.querySelector("#lbBody");
      if (!body) return;
      if (!donations.length){
        body.innerHTML =
          '<div class="lb-empty">' + ICONS.emptyBox +
          "<div><strong>No donations yet.</strong><br/>Be the first name on the wall.</div></div>";
        return;
      }
      const groups = { S:[], A:[], B:[], C:[], D:[] };
      donations.forEach(function(d){ groups[tierOf(d.amount).key].push(d); });
      let rank = 0;
      let html = "";
      ["S","A","B","C","D"].forEach(function(key){
        const list = groups[key];
        if (!list.length) return;
        const t = tierOf(key === "S" ? 200 : key === "A" ? 75 : key === "B" ? 25 : key === "C" ? 5 : 0);
        html += '<div class="tier-group">' +
          '<div class="tier-label"><div class="tier-chip" style="background:' + t.color + ';">' + key + '</div>' +
          '<div class="tier-name">' + t.name + '</div><div class="tier-line"></div></div>';
        list.forEach(function(d){
          rank++;
          const rankClass = rank===1 ? "top1" : rank===2 ? "top2" : rank===3 ? "top3" : "";
          const rankMark = rank===1 ? ICONS.crown : ("#" + rank);
          const fresh = d.id === lastAddedId ? " fresh" : "";
          html += '<div class="row' + fresh + '">' +
            '<div class="rank ' + rankClass + '">' + rankMark + "</div>" +
            '<img class="avatar" src="' + (d.photo || ICONS.carrotAvatar) + '" alt="" />' +
            '<div class="row-name"><div class="n">' + escapeHtml(d.name || "Anonymous Citizen") + "</div></div>" +
            '<div class="row-amount"><div class="a">' + fmtAmount(d.amount) + '<span class="unit"> Dollars</span></div></div>' +
          "</div>";
        });
        html += "</div>";
      });
      body.innerHTML = html;
    });
    return wrap;
  }

  /* ================= boot ================= */
  DonationsStore.init();
  PostsStore.init();
  CommentsStore.init();
  VotesStore.init();
  SignaturesStore.init();
  VideosStore.init();
  VideoViewsStore.init();
  VideoLikesStore.init();
  AssetStore.init();
  render("home");
})();
</script>
